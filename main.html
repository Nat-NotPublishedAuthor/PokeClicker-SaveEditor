<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéClicker Save Editor</title>
<style>
:root{color-scheme:light dark;--bg:#f3f3f7;--sf:#fff;--sf2:#eef0f6;--fg:#1c1b22;--mu:#6b6f80;--bd:#e1e3ec;--ac:#3b6cf6;--ac2:#e3ebff;--acfg:#fff;--r:14px;--sh:0 1px 3px rgba(20,20,40,.08),0 4px 14px rgba(20,20,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#16171d;--sf:#20222b;--sf2:#2a2d38;--fg:#ecedf3;--mu:#9a9fb2;--bd:#343746;--ac:#8ab0ff;--ac2:#25335a;--acfg:#10182f;--sh:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:600;flex:1}
.logo{width:28px;height:28px;border-radius:50%;background:linear-gradient(#e53935 50%,#fff 50%);border:3px solid var(--fg);position:relative}
.logo:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;border:2px solid var(--fg)}
.layout{display:flex;max-width:1250px;margin:0 auto;padding:16px;gap:16px;align-items:flex-start}
nav{width:190px;flex:none;position:sticky;top:70px;display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;color:var(--fg);padding:9px 12px;border-radius:10px;text-align:left;font:inherit;cursor:pointer}
nav button:hover{background:var(--sf2)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
h2{margin:0 0 12px;font-size:16px;font-weight:600}h3{margin:14px 0 8px;font-size:14px}
textarea{width:100%;height:84px;font:12px ui-monospace,Consolas,monospace;background:var(--sf2);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button.b,label.b{display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:var(--acfg);border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer;margin:6px 8px 0 0}
button.t,label.t{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.b.on{outline:2px solid var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-bottom:2px solid var(--bd);border-radius:8px;background:var(--sf2);color:var(--fg);font:inherit}
input:focus,select:focus{outline:0;border-bottom-color:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sf2);border-radius:10px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
input[type=color]{width:46px;height:34px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}.bar>*{flex:1 1 150px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mu);font-weight:500;padding:6px}
td{padding:4px 6px;border-top:1px solid var(--bd);vertical-align:middle}td input[type=number]{width:70px;padding:4px}td input[type=text]{padding:4px 6px}td select{padding:4px}
.tw{overflow-x:auto}.pg{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--mu)}
.spr{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;display:block}.bar>.spr{flex:0 0 56px}
.mu{color:var(--mu)}details{margin-left:14px}summary{cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:20}#toast.s{opacity:1}
.ico{width:28px;height:28px;object-fit:contain;image-rendering:pixelated;flex:none}.ir{display:flex;align-items:center;gap:8px}
.leaf{display:flex;gap:8px;align-items:center;margin:3px 0 3px 14px}.leaf b{min-width:110px;font:12px ui-monospace,monospace;color:var(--mu);overflow-wrap:anywhere}
.badge{background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px}
.oak{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--sf2);border-radius:12px}
.oak .row{display:flex;align-items:center;gap:8px}.oak .row b{flex:1}.oak .row select{width:70px}
.arr{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:6px;cursor:pointer;width:26px;height:26px;transition:.15s}.arr.o{transform:rotate(90deg)}
.dd{margin:0;position:relative;display:inline-block}.dd>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;min-width:170px}
.ddm{position:absolute;z-index:8;top:100%;left:0;min-width:230px;max-height:300px;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:4px}
.ddi{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--fg);padding:4px 8px;border-radius:6px;cursor:pointer;font:inherit}.ddi:hover,.ddi.on{background:var(--ac2)}.ddi span:nth-child(2){flex:1;text-align:left}
.plots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px;padding:10px;background:var(--sf2);border-radius:12px}
.plot{position:relative;aspect-ratio:1/1;cursor:pointer}.plot:hover{filter:brightness(95%)}.plot.lk{opacity:.7}
.plot .soil{width:100%;display:block;image-rendering:pixelated}.plot .pb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.plot .plk{position:absolute;right:4px;bottom:4px;width:16px;height:16px;pointer-events:none}.plot .lkx{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;pointer-events:none}
.Boost_Mulch{filter:hue-rotate(200deg)}.Rich_Mulch{filter:hue-rotate(90deg)}.Surprise_Mulch{filter:hue-rotate(300deg)}.Amaze_Mulch{filter:hue-rotate(250deg)}.Freeze_Mulch{filter:brightness(200%) hue-rotate(210deg)}.Gooey_Mulch{filter:hue-rotate(30deg) saturate(200%)}
.mine{overflow-x:auto;background:#2b1d11;border-radius:8px}.mw{position:relative;padding:4px}
.mo{position:absolute;inset:4px;display:grid;gap:1px;pointer-events:none;z-index:1}.mob{position:relative}.moi{position:absolute;left:50%;top:50%;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated}
.mg{position:relative;z-index:2;display:grid;gap:1px}.mt{position:relative;aspect-ratio:1/1;cursor:pointer;overflow:hidden;font:10px ui-monospace,monospace}.mt:hover{outline:1px solid rgba(255,255,255,.5);outline-offset:-1px}
.mt .md{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.55)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tt{border:2px solid var(--bd);border-radius:12px;padding:8px;cursor:pointer;background:var(--sf2);text-align:left;font:inherit;color:var(--fg)}.tt.on{border-color:var(--ac)}.tt i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:3px;border:1px solid rgba(128,128,128,.4)}
@media(max-width:720px){.layout{flex-direction:column;padding:10px}nav{width:100%;flex-direction:row;overflow-x:auto;position:static}nav button{white-space:nowrap}}
</style></head><body>
<div class="top"><div class="logo"></div><h1>PokéClicker Save Editor</h1><span class="mu" id="ver"></span>
<button class="b" id="dl" hidden onclick="exp('dl')">Download</button><button class="b t" id="cp" hidden onclick="exp('copy')">Copy</button></div>
